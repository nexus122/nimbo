<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Nimbo">
  <title>Nimbo</title>
  <!-- Icono de aplicacion: el simbolo sobre fondo solido. Este es el que se
       rasteriza a assets/icon.png (ventanas, barra de tareas, instalador NSIS):
       el aro gris sobre transparente puede perderse contra una barra de tareas
       clara, y el fondo grafito le garantiza contraste en todas partes.
       Para la bandeja, donde se quiere transparencia, va logo.svg. -->
  <rect width="256" height="256" rx="56" fill="#16181D"/>

  <g transform="translate(128,128) scale(0.76) translate(-128,-128)">
    <circle cx="128" cy="128" r="88" fill="none" stroke="#9AA1AB" stroke-width="24"/>
    <path d="M65.77,65.77 A88,88 0 0 1 190.23,65.77" fill="none" stroke="#E8A33D" stroke-width="24" stroke-linecap="round"/>
    <circle cx="128" cy="128" r="22" fill="#E8A33D"/>
  </g>
</svg>
