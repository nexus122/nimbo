<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Rueda (vista previa)</title>
    <link rel="stylesheet" href="../renderer/theme.css" />
    <link rel="stylesheet" href="../renderer/radial.css" />
    <style>
      body { display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #39414f; }
    </style>
  </head>
  <body>
    <div id="wheel"></div>
    <script>
      // Sustituto de la API que expone el preload. Solo lo que usa radial.js.
      const ICON = (c) => 'data:image/svg+xml;utf8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" rx="9" fill="' + c + '"/></svg>');
      const theme = new URLSearchParams(location.search).get('theme') || 'grafito';
      window.nimbo = {
        getTheme: async () => theme,
        getWheelSize: async () => 480,
        getActiveWheel: async () => ({ name: 'Principal', items: [
          { type: 'app', name: 'Firefox', icon: ICON('#ff8a3d') },
          { type: 'app', name: 'VS Code', icon: ICON('#3d8aff') },
          { type: 'app', name: 'Spotify', icon: ICON('#3ddc84') },
          { type: 'folder', name: 'Juegos', icon: '🎮', items: [] },
          { type: 'app', name: 'Obsidian', icon: ICON('#a06bff') },
          { type: 'link', name: 'GitHub', icon: '🔗', url: '#' },
          { type: 'app', name: 'Terminal', icon: ICON('#6b7280') },
        ] }),
        launchApp() {}, openLink() {}, closeRadial() {}, openSettings() {},
      };
    </script>
    <script src="../renderer/radial.js"></script>
  </body>
</html>
