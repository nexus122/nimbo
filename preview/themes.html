<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Temas de Opie</title>
    <style>
      body { margin: 0; background: #2b3240; font-family: 'Segoe UI', sans-serif; color: #fff; }
      .row { display: flex; flex-wrap: wrap; }
      figure { margin: 0; flex: 1 1 480px; }
      figcaption { text-align: center; padding: 12px; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.7; }
      iframe { border: 0; width: 100%; height: 500px; display: block; }
      p { text-align: center; opacity: 0.5; font-size: 12px; padding: 8px 0 20px; margin: 0; }
    </style>
  </head>
  <body>
    <div class="row">
      <figure><figcaption>Grafito</figcaption><iframe src="wheel.html?theme=grafito"></iframe></figure>
      <figure><figcaption>Papel</figcaption><iframe src="wheel.html?theme=papel"></iframe></figure>
      <figure><figcaption>Malva</figcaption><iframe src="wheel.html?theme=malva"></iframe></figure>
    </div>
    <p>Click en una rueda y usa las flechas para ver el sector de luz.</p>
  </body>
</html>
