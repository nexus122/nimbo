<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: var(--font-ui);
        margin: 0;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      header h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
      }
      header p {
        font-size: 11px;
        color: var(--text-dim);
        margin: 2px 0 0;
      }
      #status {
        color: var(--ok);
        font-size: 12px;
        max-width: 420px;
        text-align: right;
      }
      #status.error {
        color: var(--danger);
      }
      .items-count {
        font-size: 10.5px;
        color: var(--text-faint);
        align-self: center;
      }
      .items-count.full {
        color: var(--warn);
      }
      .small-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .small-btn:disabled:hover {
        background: var(--fill-1);
      }
      #picker-actions {
        display: flex;
        gap: 8px;
        padding: 10px;
        border-bottom: 1px solid var(--line);
      }
      #picker-actions .small-btn {
        flex: 1;
        text-align: center;
      }
      #picker-empty {
        padding: 22px 16px;
        text-align: center;
        color: var(--text-faint);
        font-size: 12px;
        line-height: 1.6;
      }
      #drop-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: var(--accent-soft);
        border: 3px dashed var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        color: var(--text);
        pointer-events: none;
        text-align: center;
        padding: 20px;
      }
      #drop-overlay[hidden] {
        display: none;
      }
      #picker-note {
        font-size: 11px;
        color: var(--warn);
        padding: 0 10px 8px;
      }
      #picker-note:empty {
        display: none;
      }
      #save {
        padding: 8px 18px;
        font-size: 13px;
        cursor: pointer;
        background: var(--accent);
        color: var(--on-accent);
        border: none;
        border-radius: 6px;
        font-weight: 600;
      }
      #save:hover {
        background: var(--accent-hi);
      }
      #layout {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #sidebar {
        width: 210px;
        border-right: 1px solid var(--line);
        padding: 12px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      #sidebar h2 {
        font-size: 12px;
        text-transform: uppercase;
        color: var(--text-dim);
        margin: 0 0 8px;
      }
      #wheel-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 10px;
      }
      .wheel-item {
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer;
        border: 1px solid transparent;
      }
      .wheel-item:hover {
        background: var(--fill-1);
      }
      .wheel-item.selected {
        background: var(--accent-soft);
        border-color: var(--accent-line);
      }
      .wheel-item-name {
        font-size: 13px;
      }
      .wheel-item-shortcut {
        font-size: 10px;
        color: var(--text-dim);
        margin-top: 2px;
      }
      #add-wheel {
        padding: 7px 10px;
        font-size: 12px;
        cursor: pointer;
        background: var(--fill-1);
        color: var(--text);
        border: 1px dashed var(--line-hi);
        border-radius: 6px;
      }
      #add-wheel:hover {
        background: var(--fill-2);
      }
      /* Selector de tema. Cada muestra lleva su propio data-theme, asi que
         hereda las variables de esa paleta y se pinta sola: no hay una segunda
         lista de colores en el JS que se pueda desincronizar de theme.css. */
      #theme-picker {
        margin-top: auto;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }
      #theme-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .theme-item {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid transparent;
        background: none;
        color: var(--text-dim);
        font-family: inherit;
        font-size: 12px;
        text-align: left;
        cursor: pointer;
        width: 100%;
      }
      .theme-item:hover {
        background: var(--fill-1);
        color: var(--text);
      }
      .theme-item.selected {
        background: var(--accent-soft);
        border-color: var(--accent-line);
        color: var(--text);
      }
      .swatch {
        position: relative;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        flex: none;
        background: var(--ring);
        border: 1px solid var(--ring-line);
      }
      .swatch::after {
        content: '';
        position: absolute;
        inset: 4px 4px 4px 50%;
        border-radius: 0 10px 10px 0;
        background: var(--accent);
      }
      .theme-hint {
        color: var(--text-faint);
        font-size: 10.5px;
      }

      #size-picker {
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }
      #size-list {
        display: flex;
        gap: 4px;
      }
      .size-item {
        flex: 1;
        padding: 6px 0;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: none;
        color: var(--text-dim);
        font-family: var(--font-mono);
        font-size: 11px;
        cursor: pointer;
      }
      .size-item:hover {
        background: var(--fill-1);
        color: var(--text);
      }
      .size-item.selected {
        background: var(--accent-soft);
        border-color: var(--accent-line);
        color: var(--text);
      }

      #main {
        flex: 1;
        padding: 16px 20px;
        overflow-y: auto;
      }
      .editor-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }
      .wheel-name-input {
        font-size: 16px;
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--line-hi);
        color: var(--text);
        padding: 4px 2px;
        flex: 1;
        max-width: 320px;
      }
      .wheel-name-input:focus {
        outline: none;
        border-bottom-color: var(--accent);
      }
      button {
        font-family: inherit;
      }
      .danger-btn {
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
        background: var(--danger-bg);
        color: var(--danger);
        border: 1px solid var(--danger-line);
        border-radius: 6px;
      }
      .danger-btn:hover {
        background: var(--danger-bg);
      }
      .shortcut-btn {
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
        background: var(--line);
        color: var(--text);
        border: 1px solid var(--line-hi);
        border-radius: 6px;
        font-family: var(--font-mono);
      }
      .shortcut-btn.capturing {
        background: var(--accent-soft);
        border-color: var(--accent);
      }
      .shortcut-btn:hover {
        background: var(--fill-3);
      }
      .small-btn {
        padding: 5px 9px;
        font-size: 11px;
        cursor: pointer;
        background: var(--fill-1);
        color: var(--text-dim);
        border: 1px solid var(--line-hi);
        border-radius: 6px;
      }
      .small-btn:hover {
        background: var(--fill-2);
      }
      #tree-root {
        margin-top: 16px;
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }
      .tree-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 6px;
        border-radius: 5px;
      }
      .tree-row:hover {
        background: var(--fill-1);
      }
      .tree-icon {
        width: 20px;
        height: 20px;
      }
      .tree-folder-icon {
        width: 20px;
        text-align: center;
        font-size: 15px;
      }
      .tree-name {
        font-size: 12.5px;
        flex: 1;
      }
      .tree-toggle {
        font-size: 10.5px;
        color: var(--text-dim);
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        white-space: nowrap;
      }
      .tree-del {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 12px;
        opacity: 0.6;
        padding: 2px 4px;
      }
      .tree-del:hover {
        opacity: 1;
      }
      .tree-icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 11px;
        opacity: 0.6;
        padding: 2px 4px;
        color: var(--text-dim);
      }
      .tree-icon-btn:hover {
        opacity: 1;
      }
      .tree-icon-btn:disabled {
        opacity: 0.2;
        cursor: not-allowed;
      }
      /* Numero de posicion: es la tecla 1-9 que abre el elemento en la rueda,
         asi que reordenar tiene efecto directo sobre el atajo de teclado. */
      .tree-pos {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--text-faint);
        width: 14px;
        text-align: right;
        flex-shrink: 0;
      }
      .tree-actions {
        display: flex;
        gap: 8px;
        margin: 6px 0 10px;
      }
      #empty-hint {
        color: var(--text-faint);
        font-size: 13px;
      }

      #picker-overlay {
        position: fixed;
        inset: 0;
        background: var(--scrim);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* El selector de ID de arriba (display:flex) gana por especificidad al
         [hidden] del navegador (display:none), asi que sin esto la ventana
         emergente se queda visible siempre, aunque tenga el atributo hidden. */
      #picker-overlay[hidden] {
        display: none;
      }

      #prompt-overlay {
        position: fixed;
        inset: 0;
        background: var(--scrim);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      #prompt-overlay[hidden] {
        display: none;
      }
      #prompt-box {
        width: 320px;
        background: var(--surface);
        border-radius: 10px;
        border: 1px solid var(--fill-2);
        padding: 16px;
      }
      #prompt-title {
        font-size: 13px;
        margin-bottom: 10px;
      }
      #prompt-input {
        width: 100%;
        padding: 7px 10px;
        font-size: 13px;
        background: var(--fill-1);
        border: 1px solid var(--line-hi);
        border-radius: 6px;
        color: var(--text);
        margin-bottom: 12px;
      }
      #prompt-input:focus {
        outline: none;
        border-color: var(--accent);
      }
      #prompt-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      #iconpicker-overlay {
        position: fixed;
        inset: 0;
        background: var(--scrim);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      #iconpicker-overlay[hidden] {
        display: none;
      }
      #iconpicker-box {
        width: 300px;
        background: var(--surface);
        border-radius: 10px;
        border: 1px solid var(--fill-2);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #iconpicker-title {
        font-size: 13px;
        margin-bottom: 2px;
      }
      #iconpicker-row {
        display: flex;
        gap: 6px;
      }
      #iconpicker-emoji-input {
        flex: 1;
        min-width: 0;
        padding: 7px 10px;
        font-size: 15px;
        background: var(--fill-1);
        border: 1px solid var(--line-hi);
        border-radius: 6px;
        color: var(--text);
      }
      #iconpicker-emoji-input:focus {
        outline: none;
        border-color: var(--accent);
      }
      #iconpicker-box .small-btn {
        width: 100%;
        text-align: center;
      }
      #iconpicker-emoji-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 4px;
        max-height: 150px;
        overflow-y: auto;
        padding: 2px;
      }
      #iconpicker-emoji-grid button {
        font-size: 17px;
        line-height: 1;
        padding: 6px 0;
        background: var(--fill-1);
        border: 1px solid var(--fill-2);
        border-radius: 6px;
        cursor: pointer;
      }
      #iconpicker-emoji-grid button:hover {
        background: var(--fill-3);
        border-color: var(--accent-line);
      }
      #picker {
        width: 460px;
        max-height: 70vh;
        background: var(--surface);
        border-radius: 10px;
        border: 1px solid var(--fill-2);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #picker-header {
        display: flex;
        gap: 8px;
        padding: 10px;
        border-bottom: 1px solid var(--line);
      }
      #picker-search {
        flex: 1;
        padding: 7px 10px;
        font-size: 13px;
        background: var(--fill-1);
        border: 1px solid var(--line-hi);
        border-radius: 6px;
        color: var(--text);
      }
      #picker-search:focus {
        outline: none;
        border-color: var(--accent);
      }
      #picker-list {
        overflow-y: auto;
        padding: 8px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 8px;
      }
      .picker-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 8px;
        border-radius: 8px;
        cursor: pointer;
        border: 1px solid transparent;
        text-align: center;
      }
      .picker-item:hover {
        background: var(--fill-1);
      }
      .picker-item.added {
        background: var(--accent-soft);
        border-color: var(--accent-line);
      }
      .picker-item img {
        width: 30px;
        height: 30px;
        margin-bottom: 5px;
      }
      .picker-item span {
        font-size: 10.5px;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Opie Launcher</h1>
        <p>Configura tus ruedas: qué contiene cada una y con qué atajo se abre.</p>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <label style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim); cursor:pointer;">
          <input type="checkbox" id="autostart-checkbox" />
          Iniciar con Windows
        </label>
        <span id="status"></span>
        <button id="save">Guardar todo</button>
      </div>
    </header>

    <div id="layout">
      <aside id="sidebar">
        <h2>Ruedas</h2>
        <div id="wheel-list"></div>
        <button id="add-wheel">+ Nueva rueda</button>

        <div id="theme-picker">
          <h2>Tema</h2>
          <div id="theme-list"></div>
        </div>

        <div id="size-picker">
          <h2>Tamaño de la rueda</h2>
          <div id="size-list"></div>
        </div>
      </aside>
      <main id="main"></main>
    </div>

    <div id="picker-overlay" hidden>
      <div id="picker">
        <div id="picker-header">
          <input id="picker-search" placeholder="Buscar entre los instalados..." disabled />
          <button id="picker-close" class="small-btn">Cerrar</button>
        </div>
        <div id="picker-actions">
          <button id="picker-browse" class="small-btn">🗂 Examinar...</button>
          <button id="picker-paste" class="small-btn">📋 Pegar ruta...</button>
          <button id="picker-scan" class="small-btn">🔍 Buscar instalados</button>
        </div>
        <div id="picker-empty">
          Arrastra aquí un programa o un acceso directo.<br />
          O usa <b>Examinar</b>, pega su ruta, o busca entre los instalados
          (tarda unos segundos: los escanea todos).
        </div>
        <div id="picker-list"></div>
        <div id="picker-note"></div>
      </div>
    </div>

    <div id="drop-overlay" hidden></div>

    <div id="prompt-overlay" hidden>
      <div id="prompt-box">
        <div id="prompt-title"></div>
        <input id="prompt-input" />
        <div id="prompt-actions">
          <button id="prompt-cancel" class="small-btn">Cancelar</button>
          <button id="prompt-ok" class="small-btn">Aceptar</button>
        </div>
      </div>
    </div>

    <div id="iconpicker-overlay" hidden>
      <div id="iconpicker-box">
        <div id="iconpicker-title">Cambiar icono</div>
        <div id="iconpicker-emoji-grid"></div>
        <div id="iconpicker-row">
          <input id="iconpicker-emoji-input" placeholder="...o pega/escribe otro emoji" maxlength="8" />
          <button id="iconpicker-emoji-ok" class="small-btn">Usar</button>
        </div>
        <button id="iconpicker-image-btn" class="small-btn">🖼 Elegir imagen...</button>
        <button id="iconpicker-reset-btn" class="small-btn">Usar por defecto</button>
        <button id="iconpicker-cancel" class="small-btn">Cancelar</button>
      </div>
    </div>

    <script src="settings.js"></script>
  </body>
</html>
